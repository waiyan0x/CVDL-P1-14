# The web container calls these endpoints over the container's loopback.
inference_address=http://127.0.0.1:8180
management_address=http://127.0.0.1:8181
metrics_address=http://127.0.0.1:8182
grpc_inference_port=8183
grpc_management_port=8184
enable_model_api=false
default_workers_per_model=1
number_of_gpu=0
number_of_netty_threads=2
netty_client_threads=2
max_request_size=16777216
default_response_timeout=30
vmargs=-Xms64m -Xmx256m
