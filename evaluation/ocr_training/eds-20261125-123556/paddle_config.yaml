Global:
  model_name: en_PP-OCRv5_mobile_rec
  debug: false
  use_gpu: true
  epoch_num: 20
  log_smooth_window: 1
  print_batch_step: 1
  save_model_dir: /content/CVDL-OCR-finetune/paddleocr-eds/20261125-123556/checkpoints
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 1
  cal_metric_during_train: false
  pretrained_model: /content/CVDL-OCR-inputs/weights/paddle-training/en_PP-OCRv5_mobile_rec_pretrained
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: /content/CVDL-OCR-finetune/paddleocr-eds/20261125-123556/dictionary.txt
  max_text_length: 40
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_en_ppocrv5.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 320
  seed: 0
  eval_batch_epoch: 1
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 5.0e-05
    warmup_epoch: 0
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 40
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: cer_score
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /content/ocr-finetune/data
    label_file_list:
    - /content/CVDL-OCR-finetune/paddleocr-eds/20261125-123556/train.tsv
    transforms: &id001
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 320
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: true
    drop_last: false
    batch_size_per_card: 8
    num_workers: 0
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /content/ocr-finetune/data
    label_file_list:
    - /content/CVDL-OCR-finetune/paddleocr-eds/20261125-123556/eval_io_not_ground_truth.tsv
    transforms: *id001
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 8
    num_workers: 0
