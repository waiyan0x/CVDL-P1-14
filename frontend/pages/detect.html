<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Read a bus electronic destination sign from an image.">
  <title>Detect — EDS Reader</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles/base.css">
  <link rel="stylesheet" href="/assets/styles/analysis.css">
  <script type="module" src="/assets/js/pages/detect.js"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header data-header></header>
  <main id="main">
    <div class="page-heading">
      <h1>Detect</h1>
      <p>Read the service number and destination from one image of a bus sign.</p>
    </div>
    <div class="columns">
      <section class="stack" aria-label="Input">
        <div class="toolbar">
          <div class="segments" role="group" aria-label="Input source" id="modes">
            <button type="button" data-mode="upload" aria-pressed="false">Upload image</button>
            <button type="button" data-mode="samples" aria-pressed="true">Samples</button>
            <button type="button" data-mode="camera" aria-pressed="false">Snapshot</button>
          </div>
          <button class="button push" type="button" id="reset">Reset</button>
        </div>
        <label class="dropzone" id="upload-zone" hidden>
          <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
          <strong>Drop an image or choose a file</strong>
          <span id="image-limit">JPG, PNG or WebP, up to 16 MB</span>
          <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Upload image">
        </label>
        <div class="stack" id="camera-panel" hidden>
          <video id="camera" class="camera-preview" autoplay playsinline muted aria-label="Camera preview"></video>
          <div class="toolbar">
            <button id="open-camera" type="button" class="button primary">Open camera</button>
            <button id="capture" type="button" class="button" disabled>Capture image</button>
          </div>
        </div>
        <div id="viewer" class="viewer" hidden></div>
        <p id="frame-label" class="frame-label"></p>
        <div id="legend" class="legend" hidden>
          <span><i aria-hidden="true"></i>Detected region</span>
          <span><i class="dashed" aria-hidden="true"></i>Estimated whole EDS box</span>
        </div>
        <div id="samples" class="samples" role="group" aria-label="Sample images"></div>
        <p id="status" class="notice" role="status" aria-live="polite">Loading models and samples…</p>
        <div id="options"></div>
      </section>
      <section class="stack tight" aria-label="Results" id="results-column">
        <div id="results" class="stack tight"><div class="message">Choose an image to start.</div></div>
        <p class="caption">Results are replaced on each new image. Reset or switching input clears them.</p>
      </section>
    </div>
  </main>
  <noscript>This application needs JavaScript to process images and display results.</noscript>
</body>
</html>
